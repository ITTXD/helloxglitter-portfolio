<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Test Print Labels</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Nunito', sans-serif; padding: 20px; background: #f8f9fc; }
h1 { font-size: 20px; color: #d45a8a; margin-bottom: 10px; }
.status { padding: 8px 14px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; font-weight: 700; }
.status-ok { background: #e0ffe0; color: #208020; border: 1px solid #b0e0b0; }
.status-err { background: #fff5f5; color: #c03030; border: 1px solid #f0c0c0; }
.status-wait { background: #fffcf0; color: #a08000; border: 1px solid #f0e0a0; }
#log { background: white; border: 1px solid #e8d8e0; border-radius: 10px; padding: 14px; font-size: 12px; font-family: monospace; white-space: pre-wrap; max-height: 300px; overflow-y: auto; margin-bottom: 16px; }
button { background: #d45a8a; color: white; border: none; border-radius: 10px; padding: 12px 20px; font-size: 14px; font-weight: 800; font-family: inherit; cursor: pointer; }
button:hover { background: #c04080; }
button:disabled { background: #e8a0b8; cursor: default; }

.label-container { position: absolute; left: -9999px; top: 0; }
.ship-label { width: 150mm; height: 100mm; padding: 8mm; background: white; font-family: 'Nunito', sans-serif; color: #333; position: relative; overflow: hidden; box-sizing: border-box; }
.ship-label-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #d45a8a; padding-bottom: 4mm; margin-bottom: 4mm; }
.ship-label-brand { font-size: 16px; font-weight: 800; color: #d45a8a; letter-spacing: -0.5px; }
.ship-label-brand span { color: #e8809e; }
.ship-label-id { font-size: 11px; font-weight: 700; color: #a09098; background: #f8f4f8; padding: 2px 8px; border-radius: 6px; }
.ship-label-customer { font-size: 14px; font-weight: 700; color: #333; margin-bottom: 2mm; }
.ship-label-customer strong { color: #d45a8a; }
.ship-label-address { font-size: 11px; color: #666; line-height: 1.6; margin-bottom: 3mm; white-space: pre-line; }
.ship-label-patterns { background: #fff5f8; border: 1px solid #f5d0de; border-radius: 6px; padding: 3mm 4mm; }
.ship-label-patterns-title { font-size: 9px; font-weight: 800; color: #d45a8a; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2mm; }
.ship-label-patterns-list { font-size: 10px; color: #806070; line-height: 1.5; }
.ship-label-footer { position: absolute; bottom: 5mm; left: 8mm; right: 8mm; display: flex; align-items: center; justify-content: space-between; border-top: 1px dashed #f0d0e0; padding-top: 3mm; }
.ship-label-date { font-size: 9px; color: #b0a0a8; }
</style>
</head>
<body>

<h1>Test Print Labels</h1>
<div id="status" class="status status-wait">⏳ กดปุ่มเพื่อเริ่มเทส</div>
<div id="log"></div>
<button id="testBtn" onclick="runTests()">เริ่มเทส</button>

<div id="labelContainer" class="label-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
var logEl = document.getElementById('log');
var statusEl = document.getElementById('status');
var btn = document.getElementById('testBtn');

function log(msg) {
  logEl.textContent += msg + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(type, msg) {
  statusEl.className = 'status status-' + type;
  statusEl.textContent = msg;
}

function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

async function runTests() {
  btn.disabled = true;
  logEl.textContent = '';
  log('=== เริ่มเทส ===\n');

  // Test 1: Check html2canvas
  log('1. เช็ค html2canvas...');
  if (typeof html2canvas === 'undefined') {
    setStatus('err', '❌ html2canvas ไม่โหลด!');
    log('   FAIL: html2canvas ไม่พบ');
    btn.disabled = false;
    return;
  }
  log('   OK: html2canvas v' + (html2canvas.version || 'loaded'));
  await sleep(200);

  // Test 2: Check jsPDF
  log('2. เช็ค jsPDF...');
  if (typeof window.jspdf === 'undefined') {
    setStatus('err', '❌ jsPDF ไม่โหลด!');
    log('   FAIL: window.jspdf ไม่พบ');
    log('   jspdf global: ' + typeof jspdf);
    btn.disabled = false;
    return;
  }
  var jsPDF = window.jspdf.jsPDF;
  log('   OK: jsPDF found');
  await sleep(200);

  // Test 3: Create test label HTML
  log('3. สร้าง label HTML...');
  var container = document.getElementById('labelContainer');
  container.innerHTML = '<div class="ship-label">'
    + '<div class="ship-label-header">'
    + '<div class="ship-label-brand">hello<span>x</span>glitter</div>'
    + '<div class="ship-label-id">HXG-20260622-TEST</div>'
    + '</div>'
    + '<div class="ship-label-customer"><strong>ถึง:</strong> ทดสอบ ระบบพิมพ์</div>'
    + '<div class="ship-label-address">123 ถนนทดสอบ แขวงทดสอบ เขตทดสอบ กรุงเทพฯ 10100</div>'
    + '<div class="ship-label-patterns">'
    + '<div class="ship-label-patterns-title">สินค้า</div>'
    + '<div class="ship-label-patterns-list">Castle Pink × 1 · Blair × 2</div>'
    + '</div>'
    + '<div class="ship-label-footer">'
    + '<div class="ship-label-date">22 มิ.ย. 69</div>'
    + '</div>'
    + '</div>';
  log('   OK: label HTML สร้างแล้ว');
  await sleep(300);

  // Test 4: html2canvas capture
  log('4. จับภาพด้วย html2canvas...');
  try {
    var canvas = await html2canvas(container.firstElementChild, { scale: 2, useCORS: true, logging: true });
    log('   OK: canvas size = ' + canvas.width + 'x' + canvas.height);
  } catch (e) {
    setStatus('err', '❌ html2canvas จับภาพไม่ได้!');
    log('   FAIL: ' + e.message);
    log('   Stack: ' + e.stack);
    btn.disabled = false;
    return;
  }
  await sleep(200);

  // Test 5: Generate PDF
  log('5. สร้าง PDF...');
  try {
    var imgData = canvas.toDataURL('image/jpeg', 0.95);
    log('   OK: toDataURL length = ' + imgData.length);

    var pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [150, 100] });
    log('   OK: jsPDF created');

    pdf.addImage(imgData, 'JPEG', 0, 0, 150, 100);
    log('   OK: addImage done');

    var pdfBlob = pdf.output('blob');
    log('   OK: blob size = ' + pdfBlob.size + ' bytes');

    pdf.save('test-label.pdf');
    log('   OK: PDF saved!');
  } catch (e) {
    setStatus('err', '❌ PDF สร้างไม่สำเร็จ!');
    log('   FAIL: ' + e.message);
    log('   Stack: ' + e.stack);
    btn.disabled = false;
    return;
  }

  setStatus('ok', '✅ ทุกขั้นตอนผ่าน! PDF ดาวน์โหลดแล้ว');
  log('\n=== ทดสอบสำเร็จ ===');
  btn.disabled = false;
}
</script>
</body>
</html>
